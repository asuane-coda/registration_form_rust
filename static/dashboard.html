<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            padding: 3.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin-top: 1rem;
            width: 100%;
            max-width: 800px; /* Wider for dashboard */
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            text-align: center;
        }

        .container:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1a1a2e;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .menu-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .menu-item {
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .menu-item.profile {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .menu-item.profile:hover {
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .menu-item.logout {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background: #ff6b6b; /* Fallback/Simple red */
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
        }

        .menu-item.logout:hover {
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            transform: translateY(-2px);
        }

        .welcome-section {
            margin-bottom: 3rem;
        }

        p.subtitle {
            color: #6c757d;
            font-size: 1.2rem;
            margin-top: -1.5rem;
            margin-bottom: 2rem;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-section">
            <h1>Welcome, {{ user.name }}!</h1>
            <p class="subtitle">We're glad to have you here.</p>
        </div>

        <div class="menu-bar">
            <a href="/profile" class="menu-item profile">My Profile</a>
            <a href="/payments" class="menu-item profile" style="background: linear-gradient(135deg, #099773 0%, #0ba360 100%);">Payments</a>
            {% if is_admin %}
                <a href="/users" class="menu-item profile" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">Admin Panel</a>
            {% endif %}
            <!-- For now, logout links to login page. Ideally, a logout route would clear session. -->
            <a href="/login" class="menu-item logout">Logout</a>
        </div>
    </div>
</body>
</html>
