<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 3.5rem;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
        }
        
        h1 {
            color: #1a1a2e;
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            color: #495057;
            font-size: 1.05rem;
            margin: 1.5rem 0;
            line-height: 1.6;
            font-weight: 500;
        }
        
        p strong {
            color: #1a1a2e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 0.95rem;
        }
        
        a {
            color: white;
            text-decoration: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 1.8rem;
            border-radius: 12px;
            display: inline-block;
            margin-top: 1rem;
            margin-right: 0.5rem;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1.2px;
            position: relative;
            overflow: hidden;
        }
        
        a:hover {
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
            transform: translateY(-3px);
        }
        
        a:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        a:nth-of-type(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
        }

        a:nth-of-type(2):hover {
            box-shadow: 0 12px 30px rgba(245, 87, 108, 0.5);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 2.5rem 1.5rem;
                border-radius: 16px;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            a {
                display: block;
                width: 100%;
                padding: 1rem;
                margin: 0.8rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Profile</h1>
        {% if user.profile_picture %}
            <img src="data:image/png;base64,{{ user.profile_picture }}" alt="Profile Picture" width="100" height="100">
        {% endif %}
        <p><strong>ID:</strong> {{ user.id }}</p>
        <p><strong>Name:</strong> {{ user.name }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Created At:</strong> {{ user.created_at }}</p>

         <p><a
            
        href="/users/{{ user.id }}/edit">Edit</a></p>

        {% if is_admin %}
            <p><a href="/users">View All Registered Users</a></p>
        {% endif %}
    </div>
</body>
</html>
